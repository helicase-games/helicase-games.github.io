<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bio-Hangman</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
</head>
<body>
    <h1>🧬 Bio-Hangman</h1>
    <div id="game-info">
        <p>Category: <span id="category-display">Loading...</span></p>
    </div>
    <div id="word-display" style="font-size: 2rem; letter-spacing: 10px;"></div>
    <p>Guessed Letters: <span id="letters-guessed"></span></p>
    <input type="text" id="guess-input" maxlength="1" placeholder="Type a letter">
    
    <script src="script.js"></script>
</body>
</html>

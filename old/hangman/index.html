<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hang-Cell | Game</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: 'Segoe UI', sans-serif;
        }

        /* Category Selection Screen */
        #menu-container {
            width: 90%;
            max-width: 900px;
            padding: 20px;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }

        .cat-btn {
            background: #21262d;
            border: 1px solid #30363d;
            color: white;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .cat-btn:hover {
            border-color: #00ff95;
            background: #30363d;
            transform: translateY(-3px);
        }

        .special-btn {
            grid-column: 1 / -1;
            background: linear-gradient(45deg, #00ff95, #00d4ff);
            color: #1a1a1a;
            font-size: 1.2rem;
        }

        /* Game Screen */
        #game-container {
            background: #2d2d2d;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 95%;
            max-width: 700px;
            box-sizing: border-box;
            display: none; /* Hidden until category is picked */
        }

        h1 { color: #00ff95; margin-top: 0; font-size: 2rem; }

        #cell-stage {
            width: 280px;
            height: 280px;
            margin: 10px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cell-component { transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform-origin: center; }
        .component-inactive { opacity: 0; transform: scale(0) rotate(20deg); }

        #membrane {
            fill: #222;
            stroke: #00ff95;
            stroke-width: 3;
            filter: drop-shadow(0 0 5px rgba(0, 255, 149, 0.3));
        }

        .membrane-stressed { stroke: #ff4757 !important; filter: drop-shadow(0 0 8px #ff4757) !important; }

        #word-display {
            font-family: 'Courier New', monospace;
            font-size: clamp(1rem, 5vw, 2.2rem);
            color: #00ff95;
            letter-spacing: 0.15rem;
            margin: 30px 0;
            display: block;
            line-height: 1.2;
            word-break: break-all;
            width: 100%;
        }

        #letters-guessed { color: #8b949e; font-weight: bold; }

        input {
            padding: 10px;
            font-size: 1.5rem;
            text-align: center;
            width: 60px;
            border: 2px solid #00ff95;
            background: #1a1a1a;
            color: white;
            border-radius: 5px;
            outline: none;
        }

        .controls { margin-top: 25px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

        button { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 0.9rem; }
        .btn-reset { background: #00ff95; color: #1a1a1a; }
        .btn-hint { background: #555; color: white; }
        #hint-display { margin-top: 15px; color: #f1c40f; font-style: italic; min-height: 1.2rem; }
        .back-link { display: block; margin-top: 25px; color: #888; text-decoration: none; font-size: 0.8rem; cursor: pointer; }
    </style>
</head>

<body>
    <div id="menu-container">
        <h1>🔬 Select Study Domain</h1>
        <div class="category-grid" id="category-buttons">
            </div>
    </div>

    <div id="game-container">
        <h2 id="active-category-title" style="color: #8b949e; margin-bottom: 5px;">Category</h2>
        <h1>Hang-Cell</h1>

        <div id="cell-stage">
            <svg viewBox="0 0 100 100" width="100%" height="100%">
                <path id="membrane" d="M95,50 C95,75 75,98 50,95 C25,92 5,75 5,50 C5,25 25,5 50,8 C75,11 95,25 95,50 Z" />
                <g id="nucleus-group" class="cell-component">
                    <path fill="#6c5ce7" d="M35,45 C35,35 45,28 55,30 C65,32 72,42 70,52 C68,62 58,68 48,65 C38,62 35,55 35,45 Z" />
                    <circle cx="55" cy="45" r="5" fill="#4834d4" opacity="0.6" />
                </g>
                <g id="mitochondria-group" class="cell-component">
                    <path fill="#e67e22" d="M20,70 Q15,60 25,58 Q35,56 30,72 Q25,80 20,70" />
                    <path fill="none" stroke="#d35400" stroke-width="0.5" d="M18,65 Q22,65 22,70 Q25,75 28,70" />
                </g>
                <g id="golgi-group" class="cell-component">
                    <path fill="none" stroke="#3498db" stroke-width="2" stroke-linecap="round" d="M70,30 Q80,30 75,45 M65,32 Q75,32 72,42 M62,35 Q70,35 68,40" />
                </g>
                <g id="dna-group" class="cell-component">
                    <path fill="none" stroke="#f1c40f" stroke-width="1" d="M48,45 Q52,48 50,52 M52,48 Q56,52 54,56 M46,50 Q50,54 48,58" />
                </g>
                <g id="ribosomes-group" class="cell-component">
                    <circle cx="20" cy="30" r="1.5" fill="#ff4757" /><circle cx="25" cy="25" r="1.5" fill="#ff4757" />
                    <circle cx="80" cy="70" r="1.5" fill="#ff4757" /><circle cx="75" cy="80" r="1.5" fill="#ff4757" />
                </g>
            </svg>
        </div>

        <div id="word-display">_ _ _ _ _</div>
        <p>Letters used: <span id="letters-guessed">None</span></p>
        <input type="text" id="guess-input" maxlength="1" autofocus autocomplete="off">
        <div id="hint-display"></div>
        <div id="message"></div>

        <div class="controls">
            <button class="btn-hint" onclick="showHint()">Get Hint</button>
            <button class="btn-reset" onclick="initGame()">New Sequence</button>
        </div>

        <div class="back-link" onclick="backToMenu()">← Change Category</div>
    </div>

    <script src="words.js"></script>
    <script src="script.js"></script>
</body>
</html>

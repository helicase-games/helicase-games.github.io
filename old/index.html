<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helicase Games</title>
    <style>
        body {
            background-color: #0d1117;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .arcade-container {
            text-align: center;
            background: #161b22;
            padding: 3rem;
            border-radius: 20px;
            border: 2px solid #30363d;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        h1 { font-size: 3rem; color: #00ff95; margin-bottom: 2rem; }
        .game-card {
            background: #21262d;
            padding: 25px;
            border-radius: 12px;
            text-decoration: none;
            color: white;
            display: inline-block;
            transition: 0.3s;
            border: 1px solid #30363d;
        }
        .game-card:hover {
            border-color: #00ff95;
            transform: translateY(-5px);
        }
        .game-title { font-size: 1.8rem; display: block; font-weight: bold; }
    </style>
</head>
<body>
    <div class="arcade-container">
        <h1>HELICASE GAMES</h1>
        
        <a href="hangman/index.html" class="game-card">
            <span class="game-title">🔬 Hang-Cell</span>
        </a>
    </div>
</body>
</html>
